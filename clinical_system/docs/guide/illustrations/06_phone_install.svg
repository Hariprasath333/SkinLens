<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="A phone home screen with the SkinLens app icon, linked by Wi-Fi and a cloud to a laptop">
  <defs>
    <filter id="a6-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b3a5b" flood-opacity=".16"/></filter>
    <linearGradient id="a6-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ee0f2"/><stop offset="1" stop-color="#0077B6"/></linearGradient>
  </defs>
  <path d="M40 200c0-110 130-170 290-170s280 60 280 170-130 160-290 160S40 310 40 200z" fill="#e3f3fb"/>
  <ellipse cx="320" cy="352" rx="260" ry="13" fill="#0b3a5b" opacity=".08"/>
  <!-- laptop -->
  <g filter="url(#a6-sh)">
    <rect x="60" y="150" width="200" height="130" rx="12" fill="#1d2b36"/>
    <rect x="71" y="161" width="178" height="108" rx="6" fill="#0f1b24"/>
    <text x="82" y="190" font-family="Consolas,Menlo,monospace" font-size="11" fill="#7ee0f2">uvicorn ... --port 8080</text>
    <text x="82" y="210" font-family="Consolas,Menlo,monospace" font-size="11" fill="#6fd3a6">Open on your phone:</text>
    <text x="82" y="228" font-family="Consolas,Menlo,monospace" font-size="11" fill="#fff">http://192.168.x.x:8080</text>
    <path d="M36 280h248l-18 24H54z" fill="#c9d6df"/>
  </g>
  <!-- link: wifi + cloud -->
  <path d="M276 210c40-40 90-40 130 0" stroke="#00B4D8" stroke-width="4" stroke-dasharray="4 9" fill="none" stroke-linecap="round"/>
  <g filter="url(#a6-sh)">
    <path d="M316 132c-16 0-28-12-28-26s12-26 26-26c4-16 18-26 34-26 20 0 34 14 36 32 12 2 20 12 20 22 0 14-12 24-26 24z" fill="#fff"/>
    <path d="M322 108a30 30 0 0 1 44 0M330 116a18 18 0 0 1 28 0" stroke="#0077B6" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="344" cy="124" r="4.5" fill="#0077B6"/>
  </g>
  <text x="346" y="160" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#0077B6" text-anchor="middle">Wi-Fi or HTTPS tunnel</text>
  <!-- phone -->
  <g filter="url(#a6-sh)">
    <rect x="420" y="40" width="160" height="300" rx="26" fill="#1d2b36"/>
    <rect x="430" y="54" width="140" height="272" rx="18" fill="url(#a6-wall)"/>
    <rect x="478" y="58" width="44" height="8" rx="4" fill="#1d2b36"/>
    <g fill="#fff" opacity=".85">
      <rect x="446" y="84" width="30" height="30" rx="9"/><rect x="485" y="84" width="30" height="30" rx="9"/><rect x="524" y="84" width="30" height="30" rx="9"/>
      <rect x="446" y="130" width="30" height="30" rx="9"/><rect x="524" y="130" width="30" height="30" rx="9"/>
      <rect x="446" y="192" width="30" height="30" rx="9"/><rect x="485" y="192" width="30" height="30" rx="9"/><rect x="524" y="192" width="30" height="30" rx="9"/>
    </g>
    <g fill="#00B4D8" opacity=".5"><circle cx="461" cy="99" r="7"/><rect x="531" y="137" width="16" height="16" rx="4"/><path d="M492 200h16v14h-16z"/></g>
    <!-- SkinLens icon -->
    <rect x="481" y="126" width="38" height="38" rx="11" fill="#0077B6" stroke="#fff" stroke-width="3"/>
    <circle cx="497" cy="142" r="9" fill="none" stroke="#fff" stroke-width="3.2"/>
    <path d="M504 149l7 7" stroke="#00B4D8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M497 137.5v9M492.5 142h9" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <text x="500" y="180" font-family="Inter,Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">SkinLens</text>
    <rect x="446" y="282" width="108" height="30" rx="15" fill="#fff" opacity=".35"/>
  </g>
  <!-- sparkle around icon -->
  <path d="M532 112l4 4M466 116l-4 4M540 160h6" stroke="#ffe66d" stroke-width="3" stroke-linecap="round"/>
</svg>
