<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-label="How SkinLens works: phone or laptop, server, AI model, result with heat-map">
  <defs>
    <filter id="a2-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0b3a5b" flood-opacity=".15"/></filter>
    <radialGradient id="a2-heat" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E63946"/><stop offset=".4" stop-color="#f4a261"/><stop offset=".65" stop-color="#ffe66d" stop-opacity=".8"/><stop offset="1" stop-color="#00B4D8" stop-opacity="0"/>
    </radialGradient>
    <marker id="a2-ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#00B4D8"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="300" rx="24" fill="#F5FAFD"/>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle" fill="#1d2b36">
    <!-- 1 devices -->
    <g filter="url(#a2-sh)">
      <rect x="40" y="88" width="150" height="100" rx="10" fill="#1d2b36"/>
      <rect x="49" y="97" width="132" height="82" rx="5" fill="#fff"/>
      <rect x="58" y="106" width="50" height="62" rx="5" fill="#e8b49a"/><circle cx="83" cy="137" r="10" fill="#7a3f2a" opacity=".55"/>
      <rect x="116" y="108" width="56" height="8" rx="4" fill="#0077B6"/><rect x="116" y="124" width="44" height="6" rx="3" fill="#cfe3ef"/>
      <rect x="116" y="150" width="56" height="16" rx="8" fill="#0077B6"/>
      <path d="M26 188h178l-12 16H38z" fill="#c9d6df"/>
      <rect x="160" y="140" width="50" height="86" rx="10" fill="#1d2b36"/>
      <rect x="165" y="147" width="40" height="72" rx="6" fill="#F5FAFD"/>
      <rect x="171" y="156" width="28" height="28" rx="6" fill="#e8b49a"/><circle cx="185" cy="170" r="6" fill="#7a3f2a" opacity=".55"/>
      <rect x="171" y="194" width="28" height="10" rx="5" fill="#0077B6"/>
    </g>
    <text x="120" y="252" font-size="17" font-weight="700">1. Take or choose a photo</text>
    <text x="120" y="274" font-size="13" fill="#5f7383">phone or laptop browser</text>
    <path d="M222 150h50" stroke="#00B4D8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#a2-ar)"/>

    <!-- 2 server -->
    <g filter="url(#a2-sh)">
      <rect x="300" y="78" width="120" height="132" rx="16" fill="#0077B6"/>
      <rect x="314" y="94" width="92" height="26" rx="7" fill="#2a8fc6"/><rect x="314" y="128" width="92" height="26" rx="7" fill="#2a8fc6"/><rect x="314" y="162" width="92" height="26" rx="7" fill="#2a8fc6"/>
      <circle cx="328" cy="107" r="5" fill="#7ee0f2"/><circle cx="328" cy="141" r="5" fill="#7ee0f2"/><circle cx="328" cy="175" r="5" fill="#2A9D8F"/>
      <rect x="344" y="104" width="50" height="6" rx="3" fill="#cfe9f7"/><rect x="344" y="138" width="40" height="6" rx="3" fill="#cfe9f7"/><rect x="344" y="172" width="46" height="6" rx="3" fill="#cfe9f7"/>
      <circle cx="350" cy="74" r="20" fill="#fff"/><circle cx="343" cy="71" r="2.6" fill="#1d2b36"/><circle cx="357" cy="71" r="2.6" fill="#1d2b36"/>
      <path d="M344 79c4 4 8 4 12 0" stroke="#1d2b36" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
    <text x="360" y="252" font-size="17" font-weight="700">2. Web server</text>
    <text x="360" y="274" font-size="13" fill="#5f7383">FastAPI on your computer</text>
    <path d="M444 150h50" stroke="#00B4D8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#a2-ar)"/>

    <!-- 3 AI brain -->
    <g filter="url(#a2-sh)">
      <circle cx="580" cy="146" r="72" fill="#fff"/>
      <path d="M548 112c-18 0-28 14-26 28-12 6-14 26-2 34 0 18 18 28 32 22 6 12 28 14 36 2V114c-8-12-30-14-40-2z" fill="#00B4D8"/>
      <path d="M612 112c18 0 28 14 26 28 12 6 14 26 2 34 0 18-18 28-32 22-6 12-28 14-36 2" fill="#0077B6"/>
      <path d="M580 114v94" stroke="#fff" stroke-width="3"/>
      <path d="M552 138c8 0 12 6 12 12M556 172c6-6 14-6 18 0M608 138c-8 0-12 6-12 12M604 172c-6-6-14-6-18 0" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="580" cy="76" r="9" fill="#2A9D8F"/><circle cx="580" cy="216" r="9" fill="#2A9D8F"/>
    </g>
    <text x="580" y="252" font-size="17" font-weight="700">3. AI model</text>
    <text x="580" y="274" font-size="13" fill="#5f7383">EfficientNetV2 + Swin V2</text>
    <path d="M664 150h50" stroke="#00B4D8" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#a2-ar)"/>

    <!-- 4 result card -->
    <g filter="url(#a2-sh)">
      <rect x="736" y="62" width="184" height="168" rx="16" fill="#fff"/>
      <rect x="736" y="62" width="184" height="36" rx="16" fill="#2A9D8F"/><rect x="736" y="82" width="184" height="16" fill="#2A9D8F"/>
      <text x="828" y="86" font-size="13" font-weight="700" fill="#fff">Result: likely benign</text>
      <rect x="750" y="110" width="70" height="70" rx="8" fill="#e8b49a"/>
      <ellipse cx="785" cy="145" rx="32" ry="30" fill="url(#a2-heat)"/>
      <rect x="830" y="114" width="76" height="9" rx="4.5" fill="#0077B6"/>
      <rect x="830" y="132" width="60" height="9" rx="4.5" fill="#00B4D8"/>
      <rect x="830" y="150" width="34" height="9" rx="4.5" fill="#00B4D8" opacity=".6"/>
      <rect x="830" y="168" width="20" height="9" rx="4.5" fill="#00B4D8" opacity=".35"/>
      <rect x="750" y="194" width="100" height="22" rx="11" fill="#e7f5f3"/><text x="800" y="209" font-size="11" font-weight="700" fill="#2A9D8F">High confidence</text>
    </g>
    <text x="828" y="252" font-size="17" font-weight="700">4. Result + explanation</text>
    <text x="828" y="274" font-size="13" fill="#5f7383">heat-map, top 3, advice</text>
  </g>
</svg>
