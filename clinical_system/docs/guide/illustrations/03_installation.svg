<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="A laptop with a terminal window and an open box labelled Python 3.12">
  <defs>
    <filter id="a3-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b3a5b" flood-opacity=".16"/></filter>
  </defs>
  <path d="M60 220c-10-110 90-180 240-180s290 60 290 170-120 150-280 150S68 320 60 220z" fill="#e3f3fb"/>
  <ellipse cx="320" cy="352" rx="260" ry="14" fill="#0b3a5b" opacity=".08"/>
  <!-- laptop with terminal -->
  <g filter="url(#a3-sh)">
    <rect x="80" y="70" width="300" height="200" rx="14" fill="#1d2b36"/>
    <rect x="94" y="84" width="272" height="172" rx="7" fill="#0f1b24"/>
    <rect x="94" y="84" width="272" height="22" rx="7" fill="#22313d"/>
    <circle cx="108" cy="95" r="4.5" fill="#E63946"/><circle cx="122" cy="95" r="4.5" fill="#f4c542"/><circle cx="136" cy="95" r="4.5" fill="#2A9D8F"/>
    <g font-family="Consolas,Menlo,monospace" font-size="12.5">
      <text x="106" y="128" fill="#7ee0f2">&gt; py -3.12 -m venv .venv</text>
      <text x="106" y="150" fill="#7ee0f2">&gt; pip install -r requirements.txt</text>
      <text x="106" y="172" fill="#9fb3c2">  Installing torch, fastapi ...</text>
      <rect x="106" y="184" width="200" height="10" rx="5" fill="#22313d"/><rect x="106" y="184" width="150" height="10" rx="5" fill="#2A9D8F"/>
      <text x="106" y="216" fill="#6fd3a6">  Successfully installed</text>
      <rect x="106" y="230" width="9" height="15" fill="#7ee0f2"/>
    </g>
    <path d="M50 270h360l-22 28H72z" fill="#c9d6df"/><rect x="190" y="270" width="80" height="8" rx="4" fill="#aebdc8"/>
  </g>
  <!-- open box -->
  <g filter="url(#a3-sh)">
    <path d="M430 220l90-30 90 30-90 30z" fill="#00B4D8"/>
    <path d="M430 220v90l90 34v-94z" fill="#0077B6"/>
