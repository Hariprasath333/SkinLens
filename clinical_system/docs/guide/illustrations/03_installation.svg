  <path d="M500 150c4-10 6-16 6-24M548 170c2-8 0-14-4-22M560 150c4-6 6-10 6-18" stroke="#00B4D8" stroke-width="2.5" stroke-dasharray="3 6" fill="none" stroke-linecap="round"/>
  <path d="M600 60v12M594 66h12" stroke="#0077B6" stroke-width="3" stroke-linecap="round" opacity=".6"/>
