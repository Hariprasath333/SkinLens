    <path d="M430 220l-26-34 90-28 26 32z" fill="#2a8fc6"/>
    <path d="M610 220l26-34-90-28-26 32z" fill="#4fb3e0"/>
    <text x="474" y="292" font-family="Inter,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#fff" transform="rotate(20 474 292)">Python</text>
    <text x="474" y="312" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#cfe9f7" transform="rotate(20 474 312)">3.12</text>
  </g>
