<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="Taking a good photo: four good examples with green ticks and two wrong examples with red crosses">
  <defs>
    <filter id="a7-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b3a5b" flood-opacity=".14"/></filter>
    <filter id="a7-blur"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="a7-skin" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#f1c3a6"/><stop offset="1" stop-color="#e2a989"/></radialGradient>
    <g id="a7-tick"><circle r="17" fill="#2A9D8F"/><path d="M-8 0l6 6 11-12" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="a7-cross"><circle r="17" fill="#E63946"/><path d="M-6.5-6.5l13 13M6.5-6.5l-13 13" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></g>
    <g id="a7-spot"><path d="M-22-6c4-14 22-20 34-10 12 8 12 26 0 32-12 8-30 4-34-8-2-6-2-10 0-14z" fill="#6b3a26"/><circle cx="-4" cy="2" r="5" fill="#4a2618" opacity=".6"/></g>
  </defs>
  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <!-- 1 good light -->
    <g filter="url(#a7-sh)"><rect x="20" y="20" width="200" height="200" rx="18" fill="#fff"/></g>
    <rect x="34" y="34" width="172" height="130" rx="12" fill="url(#a7-skin)"/>
    <use href="#a7-spot" x="120" y="104"/>
    <circle cx="70" cy="62" r="14" fill="#ffd34d"/><path d="M70 40v-6M70 90v-6M48 62h-6M98 62h-6M55 47l-4-4M85 47l4-4M55 77l-4 4M85 77l4 4" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/>
    <use href="#a7-tick" x="196" y="40"/>
    <text x="120" y="194" font-size="17" font-weight="700" fill="#1d2b36">Good light</text>
    <!-- 2 in focus -->
    <g filter="url(#a7-sh)"><rect x="240" y="20" width="200" height="200" rx="18" fill="#fff"/></g>
    <rect x="254" y="34" width="172" height="130" rx="12" fill="url(#a7-skin)"/>
    <use href="#a7-spot" x="340" y="100"/>
    <path d="M300 64h-14v14M380 64h14v14M300 138h-14v-14M380 138h14v-14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <use href="#a7-tick" x="416" y="40"/>
    <text x="340" y="194" font-size="17" font-weight="700" fill="#1d2b36">In focus</text>
    <!-- 3 about 10 cm -->
    <g filter="url(#a7-sh)"><rect x="460" y="20" width="200" height="200" rx="18" fill="#fff"/></g>
    <rect x="474" y="34" width="172" height="130" rx="12" fill="#e3f3fb"/>
    <rect x="490" y="132" width="140" height="22" rx="11" fill="#e2a989"/><ellipse cx="560" cy="140" rx="7" ry="5" fill="#6b3a26"/>
    <rect x="540" y="48" width="40" height="30" rx="6" fill="#1d2b36"/><circle cx="560" cy="63" r="7" fill="#7ee0f2"/>
    <path d="M600 82v44" stroke="#0077B6" stroke-width="3"/><path d="M594 88l6-8 6 8M594 120l6 8 6-8" stroke="#0077B6" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="618" y="110" font-size="13" font-weight="800" fill="#0077B6" text-anchor="start">10 cm</text>
    <use href="#a7-tick" x="636" y="40"/>
    <text x="560" y="194" font-size="17" font-weight="700" fill="#1d2b36">About 10 cm away</text>
    <!-- 4 centred -->
    <g filter="url(#a7-sh)"><rect x="680" y="20" width="200" height="200" rx="18" fill="#fff"/></g>
    <rect x="694" y="34" width="172" height="130" rx="12" fill="url(#a7-skin)"/>
    <use href="#a7-spot" x="780" y="96"/>
    <path d="M780 46v26M780 124v28M706 99h28M826 99h28" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
    <circle cx="780" cy="99" r="38" stroke="#fff" stroke-width="3" fill="none" opacity=".9"/>
    <use href="#a7-tick" x="856" y="40"/>
    <text x="780" y="194" font-size="17" font-weight="700" fill="#1d2b36">Lesion in the centre</text>

    <!-- wrong 1 blurry -->
    <g filter="url(#a7-sh)"><rect x="130" y="250" width="290" height="200" rx="18" fill="#fff"/></g>
    <rect x="144" y="264" width="262" height="130" rx="12" fill="url(#a7-skin)"/>
    <g filter="url(#a7-blur)"><use href="#a7-spot" x="275" y="326"/><use href="#a7-spot" x="290" y="330" opacity=".5"/></g>
    <use href="#a7-cross" x="396" y="270"/>
    <text x="275" y="424" font-size="17" font-weight="700" fill="#E63946">Blurry</text>
    <!-- wrong 2 dark -->
    <g filter="url(#a7-sh)"><rect x="480" y="250" width="290" height="200" rx="18" fill="#fff"/></g>
    <rect x="494" y="264" width="262" height="130" rx="12" fill="#3b2a24"/>
    <use href="#a7-spot" x="625" y="326" opacity=".45"/>
    <rect x="494" y="264" width="262" height="130" rx="12" fill="#0f1b24" opacity=".45"/>
    <use href="#a7-cross" x="746" y="270"/>
    <text x="625" y="424" font-size="17" font-weight="700" fill="#E63946">Too dark</text>
  </g>
</svg>
