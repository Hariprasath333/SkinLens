<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="A friendly robot holding a wrench, with a question mark">
  <defs>
    <filter id="a8-sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0b3a5b" flood-opacity=".16"/></filter>
  </defs>
  <circle cx="260" cy="190" r="170" fill="#e3f3fb"/>
  <ellipse cx="250" cy="352" rx="150" ry="12" fill="#0b3a5b" opacity=".09"/>
  <g filter="url(#a8-sh)">
    <!-- antenna -->
    <path d="M250 70v-26" stroke="#0077B6" stroke-width="5" stroke-linecap="round"/><circle cx="250" cy="40" r="9" fill="#E63946"/>
    <!-- head -->
    <rect x="180" y="70" width="140" height="104" rx="28" fill="#fff"/>
    <rect x="196" y="88" width="108" height="66" rx="18" fill="#1d2b36"/>
    <circle cx="228" cy="116" r="10" fill="#7ee0f2"/><circle cx="272" cy="116" r="10" fill="#7ee0f2"/>
    <circle cx="231" cy="113" r="3.5" fill="#fff"/><circle cx="275" cy="113" r="3.5" fill="#fff"/>
    <path d="M236 136c8 6 20 6 28 0" stroke="#7ee0f2" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="168" y="104" width="14" height="34" rx="7" fill="#00B4D8"/><rect x="318" y="104" width="14" height="34" rx="7" fill="#00B4D8"/>
    <!-- body -->
    <rect x="196" y="180" width="108" height="112" rx="24" fill="#0077B6"/>
    <rect x="216" y="202" width="68" height="44" rx="10" fill="#2a8fc6"/>
    <path d="M232 224h8l4-10 8 20 4-10h12" stroke="#7ee0f2" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="232" cy="268" r="6" fill="#7ee0f2"/><circle cx="250" cy="268" r="6" fill="#2A9D8F"/><circle cx="268" cy="268" r="6" fill="#ffd34d"/>
    <!-- legs -->
    <rect x="214" y="290" width="26" height="50" rx="10" fill="#005f92"/><rect x="262" y="290" width="26" height="50" rx="10" fill="#005f92"/>
    <!-- left arm waving -->
    <path d="M200 200c-30 0-46-20-50-46" stroke="#00B4D8" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="150" cy="148" r="14" fill="#fff"/>
    <!-- right arm with wrench -->
    <path d="M300 214c30 6 48 20 54 40" stroke="#00B4D8" stroke-width="18" fill="none" stroke-linecap="round"/>
    <g transform="rotate(-40 368 262)">
      <rect x="360" y="230" width="16" height="78" rx="7" fill="#aebdc8"/>
      <path d="M352 222a20 20 0 1 0 32 0l-8 0v14h-16v-14z" fill="#aebdc8"/>
    </g>
    <circle cx="356" cy="258" r="14" fill="#fff"/>
  </g>
  <!-- question bubble -->
  <g filter="url(#a8-sh)">
    <path d="M382 52h80c12 0 20 8 20 20v42c0 12-8 20-20 20h-46l-20 18 4-18h-18c-12 0-20-8-20-20V72c0-12 8-20 20-20z" fill="#fff"/>
    <text x="422" y="114" font-family="Inter,Segoe UI,sans-serif" font-size="58" font-weight="800" fill="#E63946" text-anchor="middle">?</text>
  </g>
  <path d="M110 90v12M104 96h12" stroke="#00B4D8" stroke-width="3" stroke-linecap="round"/>
</svg>
