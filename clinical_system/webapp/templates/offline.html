<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0077B6">
  <title>Offline · SkinLens</title>
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="/static/icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card" style="text-align:center">
    <img src="/static/img/app-icon.svg" alt="SkinLens logo" width="72" height="72">
    <h1 style="margin-top:14px">You are offline</h1>
    <p class="muted">SkinLens needs a connection to analyse images and to open records. Check your Wi-Fi or mobile data and try again.</p>
    <button class="btn block" onclick="location.reload()">Try again</button>
    <p class="small muted" style="margin-top:16px">SkinLens is a research project, not a medical diagnosis.</p>
  </div>
</div>
</body>
</html>
